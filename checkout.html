<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — TAVRA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    .checkout-page {
      min-height: 100vh;
      padding: 48px 0 80px;
      background: var(--paper, #f7f3ed);
    }

    .checkout-heading {
      margin-bottom: 32px;
      font-family: "Cormorant Garamond", serif;
    }

    .checkout-panel {
      padding: 28px;
      border: 1px solid #ded5c8;
      background: #fff;
    }

    .checkout-panel h2 {
      margin-bottom: 22px;
      font: 30px/1.1 "Cormorant Garamond", serif;
    }

    .checkout-panel label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
    }

    .checkout-panel input,
    .checkout-panel textarea {
      width: 100%;
      margin-bottom: 18px;
      padding: 12px;
      border: 1px solid #ded5c8;
      background: #fff;
      font: inherit;
    }

    #checkoutItems {
      margin-bottom: 18px;
    }

    .checkout-item {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #ded5c8;
      font-size: 14px;
    }

    #checkoutMessage {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container py-3">
      <a class="brand-mark" href="index.html" aria-label="TAVRA home">T<span>✦</span></a>
    </div>
  </header>

  <main class="checkout-page">
    <div class="container">
      <h1 class="checkout-heading">Complete your order</h1>

      <div class="row g-4">
        <section class="col-12 col-lg-7">
          <div class="checkout-panel">
            <h2>Delivery details</h2>

            <form id="checkoutForm">
              <label for="customerName">Full name</label>
              <input id="customerName" name="customer_name" type="text" required maxlength="120" autocomplete="name">

              <label for="customerEmail">Email address</label>
              <input id="customerEmail" name="email" type="email" required maxlength="254" autocomplete="email">

              <label for="customerPhone">Phone number</label>
              <input id="customerPhone" name="phone" type="tel" maxlength="40" autocomplete="tel">

              <label for="shippingAddress">Delivery address</label>
              <textarea id="shippingAddress" name="shipping_address" rows="4" required maxlength="500" autocomplete="street-address"></textarea>

              <button class="dark-button" type="submit">PLACE ORDER</button>
              <p id="checkoutMessage" aria-live="polite"></p>
            </form>
          </div>
        </section>

        <aside class="col-12 col-lg-5">
          <div class="checkout-panel">
            <h2>Your order</h2>
            <div id="checkoutItems">
              <p>Loading your bag…</p>
            </div>
            <strong id="checkoutTotal"></strong>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="supabase-config.js"></script>
<script type="module" src="checkout.js"></script>
</body>
</html>
